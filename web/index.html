<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frontier Ecosystem Lab</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23091416'/%3E%3Cpath d='M18 45c15-3 25-13 29-29-16 4-26 14-29 29Z' fill='%239ccf43'/%3E%3Cpath d='M22 42c7-8 14-14 23-22' stroke='%23e8f6c8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="game-shell" aria-label="Frontier Ecosystem Lab">
      <canvas id="world" aria-label="ecosystem map"></canvas>

      <div class="top-layer">
        <section class="minimap-panel" aria-label="minimap">
          <canvas id="minimap" width="180" height="180"></canvas>
          <button class="round-tool mini-tool mini-tool-a" id="inspect-toggle" type="button" title="Inspect" aria-label="Inspect">
            <span class="tool-icon icon-lens"></span>
          </button>
          <button class="round-tool mini-tool mini-tool-b" id="fauna-toggle" type="button" title="Fauna view" aria-label="Fauna view">
            <span class="tool-icon icon-track"></span>
          </button>
          <button class="round-tool mini-tool mini-tool-c" id="plant-toggle" type="button" title="Plant view" aria-label="Plant view">
            <span class="tool-icon icon-leaf"></span>
          </button>
        </section>

        <button class="cycle-button" id="cycle-plant" type="button" title="Cycle plant" aria-label="Cycle plant">
          <span>∞</span>
        </button>

        <section class="score-panel" aria-label="ecosystem status">
          <div class="score-row">
            <span>Bio-Score:</span>
            <strong id="bio-score">0</strong>
          </div>
          <div class="score-row">
            <span>Gungans:</span>
            <strong id="gungan-count">0</strong>
          </div>
          <div class="score-row">
            <span>Fauna:</span>
            <strong id="fauna-count">0</strong>
          </div>
        </section>
      </div>

      <aside class="plant-card-readout" id="readout" aria-live="polite">
        <strong id="readout-title">Sungrass</strong>
        <span id="readout-body">Hardy ground cover</span>
      </aside>

      <section class="bottom-console" aria-label="build controls">
        <div class="mode-bank" aria-label="terrain tools">
          <button class="console-button is-active" type="button" data-mode="plant" title="Plant" aria-label="Plant">
            <span class="tool-icon icon-leaf"></span>
          </button>
          <button class="console-button" type="button" data-mode="water" title="Water brush" aria-label="Water brush">
            <span class="tool-icon icon-drop"></span>
          </button>
          <button class="console-button" type="button" data-mode="soil" title="Soil brush" aria-label="Soil brush">
            <span class="tool-icon icon-soil"></span>
          </button>
          <button class="console-button" type="button" data-mode="inspect" title="Inspect" aria-label="Inspect">
            <span class="tool-icon icon-lens"></span>
          </button>
        </div>

        <div class="seed-dial" aria-label="selected plant">
          <div class="dial-ring">
            <span class="seed-count" id="seed-count">60</span>
            <span class="selected-swatch" id="selected-swatch"></span>
            <strong id="selected-name">Sungrass</strong>
          </div>
        </div>

        <div class="palette-shell">
          <div class="palette" id="plant-palette" aria-label="plant palette"></div>
          <div class="plant-stats" id="plant-stats"></div>
        </div>
      </section>
    </main>

    <script src="./game.js" defer></script>
  </body>
</html>
